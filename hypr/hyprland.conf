################
### MONITORS ###
################
# Single screen (Laptop)
# monitor=,preferred,auto,1

# Single screen (Monitor)
monitor=HDMI-A-1,preferred,auto,1
monitor=eDP-1,disable

# Multiple screens (Monitor and laptop)
# monitor=HDMI-A-1,preferred,auto,1
# monitor=eDP-1,preferred,auto,1

workspace=1,monitor:HDMI-A-1
workspace=2,monitor:HDMI-A-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:eDP-1
workspace=5,monitor:eDP-1
workspace=6,monitor:eDP-1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = kitty yazi
$menu = wofi --show drun


#################
### AUTOSTART ###
#################
exec-once = swayosd-server
exec-once = hypridle
exec-once = swaync
exec-once = hyprpaper
exec-once = waybar -c ~/.config/waybar/config-dual.jsonc -s ~/.config/waybar/style.css

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################
ecosystem {
    no_update_news = true
    #enforce_permissions = 1
}
# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgb(88C0D0) # rgb(E5C07B)
    col.inactive_border = rgba(3B425266)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = false # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}


#############
### INPUT ###
#############
input {
    kb_layout = us,latam
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

gestures {
    # workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod, R, exec, hyprctl reload && notify-send -u low -i preferences-system "Hyprland Reloaded" "Your config was reloaded."
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod CTRL, Q, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, J, togglesplit, # dwindle Alterna entre división horizontal y vertical
bind = $mainMod, H, exec, pkill -SIGUSR1 waybar || (waybar -c ~/.config/waybar/config-laptop.jsonc -s ~/.config/waybar/style-laptop.css & waybar -c ~/.config/waybar/config-monitor.jsonc -s ~/.config/waybar/style-monitor.css &)

bind = $mainMod, z, exec, swaync-client -t

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, N, workspace, 1 # Home row for "n" - ergonomic for workspace 1
bind = $mainMod, E, workspace, 2 # Home row for "e" - ergonomic for workspace 2
bind = $mainMod, I, workspace, 3 # Home row for "i" - ergonomic for workspace 3
bind = $mainMod, L, workspace, 4 # Home row for "l" - ergonomic for workspace 4
bind = $mainMod, U, workspace, 5 # Home row for "u" - ergonomic for workspace 5
bind = $mainMod, Y, workspace, 6 # Home row for "y" - ergonomic for workspace 6

# Move active window to a workspace
bind = $mainMod SHIFT, N, movetoworkspace, 1
bind = $mainMod SHIFT, E, movetoworkspace, 2
bind = $mainMod SHIFT, I, movetoworkspace, 3
bind = $mainMod SHIFT, L, movetoworkspace, 4
bind = $mainMod SHIFT, U, movetoworkspace, 5
bind = $mainMod SHIFT, Y, movetoworkspace, 6

# Toggle viewing the special workspace
# bind = $mainMod, S, togglespecialworkspace, magic
# Move focused window into the special workspace
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic
# Move focused window back to the current normal workspace
# bind = $mainMod CTRL, S, movetoworkspace, previous

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5

# bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5

# bind = , Caps_Lock, exec, swayosd-client --caps-lock (optional)

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# All monitors (screenshoot)
# bind = , Print, exec, grim - | wl-copy

# Region screenshot
bind = SHIFT, Print, exec, ~/.config/zsh/screenshoot.zsh region
# Region screenshoot clipboard
bind = CTRL SHIFT, Print, exec, ~/.config/zsh/temp_screenshoot.zsh region_temp

# Current monitor screenshoot
bind = , Print, exec, ~/.config/zsh/screenshoot.zsh monitor
# Current monitor screenshoot clipboard
bind = CTRL, Print, exec, ~/.config/zsh/temp_screenshoot.zsh monitor_temp

# Active window screenshoot
bind = ALT, Print, exec, ~/.config/zsh/screenshoot.zsh window
# Active window screenshoot clipboard
bind = CTRL ALT, Print, exec, ~/.config/zsh/temp_screenshoot.zsh window_temp

# grim -o HDMI-A-1 ~/Pictures/screenshot-hdmi.png
# grim -o eDP-1 ~/Pictures/screenshot-edp.png

bind = $mainMod, semicolon, exec, hyprlock

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
