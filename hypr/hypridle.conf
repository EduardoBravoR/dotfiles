# Archivo de configuración para hypridle (e.g., ~/.config/hypr/hypridle.conf)
general {
    # Tiempo de inactividad inicial para el primer evento (en segundos)
    # Por ejemplo, 300 segundos = 5 minutos para BLOQUEAR.
    lock_cmd = pidof hyprlock || hyprlock # Asegura que hyprlock no se ejecute dos veces
    unlock_cmd = # Puedes dejarlo vacío
    before_sleep_cmd = loginctl lock-session # Opcional: Bloquea antes de suspender
    after_sleep_cmd = systemctl --user start some-service@user
    ignore_dbus_inhibit = false
    # idle_time = 300 # Este es obsoleto, usa el temporizador en cada listener
}

# --- Listener 1: BLOQUEAR LA PANTALLA (e.g., después de 5 minutos) ---
listener {
    timeout = 900 # 900 segundos = 15 minutos
    on-timeout = hyprlock # Bloquea la pantalla
}

# --- Listener 2: APAGAR LA PANTALLA (e.g., después de 10 minutos, OJO: el tiempo es ACUMULATIVO desde el último INPUT) ---
listener {
    timeout = 1200 # 1200 segundos = 20 minutos
    on-timeout = hyprctl dispatch dpms off # Apaga la pantalla (manda la señal DPMS off)
    on-resume = hyprctl dispatch dpms on # Vuelve a encender la pantalla al reanudar
}

# --- Listener 3: SUSPENDER EL SISTEMA (e.g., después de 15 minutos) ---
listener {
    timeout = 1500 # 900 segundos = 25 minutos
    # systemctl suspend es la forma más común. También puedes usar loginctl suspend
    on-timeout = systemctl suspend
}
