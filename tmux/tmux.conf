set -g mouse on

# change default prefix
unbind C-b
set -g prefix C-t
bind C-t send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf; display "Tmux Reloaded"

set -g base-index 1
set -g pane-base-index 1

# set vi-mode to yank text
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Configure Tmux
set -g status-position top
set -g status-style "bg=default"
set -g status-justify "left"

set -g @od_dark_gray "#282c34"
set -g @od_dark_yellow "#ebd09c"
set -g @od_dark_orange "#d19a66"
set -g @od_dark_light_gray "#abb2bf"
set -g @od_dark_green "#98c379"
set -g @od_dark_blue "#73b8f1"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=#{@od_dark_gray},fg=#{@od_dark_yellow},none]"
set -ga status-left "#[bg=#{@od_dark_yellow},fg=#{@od_dark_gray},none]  "
set -ga status-left "#[bg=#{@od_dark_gray},fg=#{@od_dark_yellow},none]"
set -ga status-left "#{?client_prefix,#{#[bg=#{@od_dark_gray},fg=#{@od_dark_light_gray},bold] #{session_name}},#{#[bg=#{@od_dark_gray},fg=#{@od_dark_yellow},bold] #{session_name}}}"
set -ga status-left "#[bg=#{@od_dark_gray},fg=#{@od_dark_light_gray},none] │ "
set -ga status-left "#[bg=#{@od_dark_gray},fg=#{@od_dark_orange},none]"
set -ga status-left "#[bg=#{@od_dark_orange},fg=#{@od_dark_gray},none]  "
set -ga status-left "#[bg=#{@od_dark_gray},fg=#{@od_dark_orange},none]"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_light_gray},none] │ "
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_green},none]"
set -ga status-right "#[bg=#{@od_dark_green},fg=#{@od_dark_gray},none]  "
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_green},none]"
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_green},bold] #{pane_index} #{pane_current_command} "
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_light_gray},none]#{?window_zoomed_flag,│,}"
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_blue},none]#{?window_zoomed_flag,,}"
set -ga status-right "#[bg=#{@od_dark_blue},fg=#{@od_dark_gray},none]#{?window_zoomed_flag,  ,}"
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_blue},none]#{?window_zoomed_flag,,}"
set -ga status-right "#[bg=#{@od_dark_gray},fg=#{@od_dark_blue},bold] #{?window_zoomed_flag,zoom,}"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Inactive window
set -g window-status-format " #{window_index} #{?#{!=:#{window_name},Window},#{window_name},} "
set -g window-status-style "bg=#{@od_dark_gray},fg=#{@od_dark_light_gray}"

# Last window
set -g window-status-last-style "bg=#{@od_dark_gray},fg=#{@od_dark_light_gray}"

set -g window-status-activity-style "bg=#{@od_dark_gray},fg=#{@od_dark_light_gray}"
set -g window-status-bell-style "bg=#{@od_dark_gray},fg=#{@od_dark_light_gray},bold"

set -gF window-status-separator "#[bg=#{@od_dark_gray},fg=#{@od_dark_light_gray}]│"

# Current window
set -g window-status-current-format " #{window_index} #{?#{!=:#{window_name},Window},#{window_name},} "
set -g window-status-current-style "bg=#{@od_dark_gray},fg=#{@od_dark_orange},bold"
run '~/.tmux/plugins/tpm/tpm'

